<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chartora · ניהול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F5F7FB;--surf:#FFFFFF;--line:#E1E6EF;--text:#121A2B;--muted:#5A6478;--acc:#2457D6;--soft:#EEF2F8;--ok:#15803D;--warn:#B45309;--err:#B42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Rubik,system-ui,sans-serif;font-size:15px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
h1{margin:0;font-size:26px;font-weight:700}h2{margin:0;font-size:16px}h3{margin:0 0 8px;font-size:17px}
.ic{display:inline-flex;align-items:center}
.layout{min-height:100vh;display:flex;flex-wrap:wrap}
.side{flex:1 1 220px;max-width:260px;background:var(--surf);border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}.brand b{display:block;font-weight:800}.brand small{color:var(--muted);font-size:12px}
.brand.big{padding:0 0 16px}.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center}
nav{display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--text);text-decoration:none!important}
.nav .ic{color:var(--muted)}.nav.active{color:var(--acc);background:var(--soft)}.nav.active .ic{color:var(--acc)}.nav.soon{opacity:.55;cursor:default}
.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:2px}
.save{font-size:12px;padding:8px 10px;border-radius:8px;background:var(--soft)}.save.ok{color:var(--ok)}.save.busy{color:var(--warn)}.save.err{color:var(--err)}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700}
.main{flex:999 1 560px;min-width:0;padding:28px 32px}
.stack{display:flex;flex-direction:column;gap:16px}.wide{flex:2 1 460px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}.head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.actions,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row.tight{gap:4px;align-items:center;flex-wrap:nowrap}.row.between{justify-content:space-between;align-items:center;width:100%}
.cols{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.cols>#side{flex:1 1 300px;position:sticky;top:16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.narrow{max-width:420px;width:100%}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--text);font:600 14px Rubik,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ghost{background:transparent}.btn.danger{color:var(--err)}.btn.wide{width:100%}
.btn:disabled,.ibtn:disabled{opacity:.4;cursor:not-allowed}
.ibtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:hover:not(:disabled){color:var(--acc);border-color:var(--acc)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{min-height:40px;border-radius:10px;border:1px solid var(--line);padding:8px 12px;font:14px Rubik,sans-serif;color:var(--text);background:var(--surf)}
textarea{resize:vertical;line-height:1.5}input.missing,textarea.missing{border-color:#F3B4AE;background:#FFF6F5}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.pair{display:flex;gap:12px;flex-wrap:wrap}.pair>label{flex:1 1 240px}
.check{flex-direction:row;align-items:center;gap:6px}.check input{min-height:auto}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1 1 140px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat small{color:var(--muted);display:block}.stat b{font-size:26px;font-weight:800}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.item.col{display:block}.item summary{cursor:pointer}.item a.grow{display:flex;flex-direction:column;color:var(--text)}.item small{color:var(--muted)}
.num{width:26px;height:26px;flex:none;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.ok{color:var(--ok);background:#15803D1A}.badge.warn{color:var(--warn);background:#B453091A}.badge.err{color:var(--err);background:#B423181A}.badge.acc{color:var(--acc);background:var(--soft)}.badge.muted{color:var(--muted);background:var(--soft);margin-inline-start:auto}
.cards{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px}.crow.open{border-color:var(--acc)}
.chead{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:start;font:inherit;color:inherit;cursor:pointer;padding:6px}
.chead small{color:var(--muted);font-weight:600;font-size:12px}.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctools{display:flex;gap:4px}
.cedit{border:1px solid var(--acc);border-top:0;border-radius:0 0 12px 12px;margin-top:-10px;padding:16px;background:#FAFBFE}
.form{display:flex;flex-direction:column;gap:12px}.form .row>label{flex:1 1 150px}
.options{display:flex;flex-direction:column;gap:8px}.opt{display:flex;gap:8px;align-items:center}.opt input[type=radio]{min-height:auto;width:18px;height:18px}.opt .pair{flex:1}
.lbl{font-size:13px;color:var(--muted);font-weight:600}.hint{color:var(--muted);font-weight:400}
.add{align-items:center}.muted{color:var(--muted)}.note{color:var(--muted);font-size:13px;margin:0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issue{display:flex;gap:8px;align-items:baseline;font-size:13px;flex-wrap:wrap}.issue.error .ic{color:var(--err)}.issue.warning .ic{color:var(--warn)}.issue a{font-weight:600}
.big{font-size:30px;font-weight:800}.big small{font-size:14px;color:var(--muted);font-weight:500}
.bar{height:10px;border-radius:999px;background:var(--soft);position:relative}.bar .fill{height:10px;border-radius:999px}.fill.ok{background:var(--ok)}.fill.warn{background:var(--warn)}.fill.err{background:var(--err)}
.bar i{position:absolute;top:-4px;width:2px;height:18px;background:var(--muted)}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px}.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font:600 12px Rubik,sans-serif;cursor:pointer;color:var(--muted)}.seg button.on{background:var(--surf);color:var(--acc)}
.phone{background:#0B1020;color:#EAF0FF;border-radius:18px;padding:18px;min-height:220px;display:flex;flex-direction:column;gap:8px;line-height:1.5}
.phone .po{border:1.5px solid #2A3550;border-radius:10px;padding:8px 10px}.phone .po.right{border-color:#2ECC71}.phone .expl{color:#9AA7C7;font-size:13px}
.phone .ill{background:#141C33;border-radius:10px;padding:10px;color:#9AA7C7;font-size:13px}.chart svg{max-width:100%;height:auto;background:#fff;border-radius:8px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.or{text-align:center;color:var(--muted);font-size:13px}
hr{border:0;border-top:1px solid var(--line);width:100%}
code.block{display:block;background:var(--soft);padding:10px;border-radius:8px;word-break:break-all}
.cfg{flex-direction:row;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--text)}.cfg input[type=number]{width:110px}.cfg b{font-weight:600}
.center{display:flex;justify-content:center;padding:40px}.spinner{width:28px;height:28px;border:3px solid var(--soft);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--text);color:#fff;padding:12px 18px;border-radius:12px;z-index:10;box-shadow:0 8px 30px #0003}.toast.err{background:var(--err)}
@media (max-width:820px){.side{position:static;height:auto;max-width:none}.main{padding:18px}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spinner"></div></div></div>
<script src="./config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
